services:
  ourplay:
    build: .
    container_name: ourplay
    env_file: .env
    ports:
      - "127.0.0.1:4449:4449"
    volumes:
      - ourplay-data:/data
    restart: unless-stopped
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: nginx-proxy

volumes:
  ourplay-data:
